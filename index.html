<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv · live ticks (public socket)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f4f8fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.2rem;
        }
        .card {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.2);
            padding: 1.8rem 2rem 2rem;
        }
        h1 {
            font-weight: 600;
            font-size: 1.7rem;
            letter-spacing: -0.02em;
            color: #0a1e2f;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.1rem;
        }
        .subhead {
            color: #3e5e72;
            font-size: 0.9rem;
            margin-bottom: 1.4rem;
            padding-left: 1rem;
            border-left: 4px solid #7bbde6;
            background: #eaf3fc;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
            padding: 0.4rem 1rem;
        }
        .status-bar {
            background: #eaf0f5;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }
        .badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 20px;
            background: #b0bcc8;
            transition: background 0.2s;
        }
        .dot.on {
            background: #1db954;
            box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.25);
        }
        .price-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 0.8rem 0 1.2rem;
        }
        .price-box {
            background: #f2f8ff;
            border-radius: 1.2rem;
            padding: 0.6rem 0.8rem 0.8rem;
            text-align: center;
            border: 1px solid #dde6ef;
        }
        .price-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #4b657a;
            font-weight: 600;
        }
        .price-value {
            font-size: 2.2rem;
            font-weight: 600;
            color: #0a1e2f;
            line-height: 1.3;
            font-variant-numeric: tabular-nums;
        }
        .symbol-badge {
            background: #0a1e2f;
            color: white;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.15rem 1rem;
            border-radius: 40px;
            display: inline-block;
        }
        .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin: 1rem 0 0.8rem;
        }
        .btn {
            background: white;
            border: 1px solid #cbd7e3;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            color: #1a3345;
            transition: 0.1s;
            background: #f6faff;
            flex: 1 1 auto;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .btn-primary {
            background: #0a1e2f;
            border: 1px solid #0a1e2f;
            color: white;
        }
        .btn-primary:hover { background: #1a3348; }
        .btn-outline:hover { background: #e3edf6; }
        .btn:active { transform: scale(0.96); }
        .log-area {
            background: #f0f6fc;
            border-radius: 1.2rem;
            padding: 0.6rem 1rem;
            margin-top: 1.2rem;
            border: 1px solid #dfe9f0;
            max-height: 130px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #1d3a4f;
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .log-entry {
            border-bottom: 1px solid #dce6ef;
            padding: 0.25rem 0;
            display: flex;
            gap: 0.6rem;
        }
        .log-entry:last-child { border-bottom: none; }
        .log-time {
            color: #4d738b;
            min-width: 58px;
        }
        .log-msg { word-break: break-word; }
        .footer {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #6f8aa0;
            text-align: center;
        }
        .error-msg {
            color: #b22234;
            background: #ffe6e6;
            border-radius: 30px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            display: inline-block;
        }
        @media (max-width: 480px) {
            .card { padding: 1.2rem; }
            .price-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <h1>📊 Deriv · tick</h1>
    <div class="subhead">
        <span id="symbolDisplay">R_100</span> · public WebSocket
    </div>

    <div class="status-bar">
        <span class="badge">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">idle</span>
        </span>
        <span id="tickCount">ticks 0</span>
    </div>

    <div class="price-grid">
        <div class="price-box">
            <div class="price-label">last price</div>
            <div class="price-value" id="lastPrice">—</div>
        </div>
        <div class="price-box">
            <div class="price-label">epoch</div>
            <div class="price-value" id="epochDisplay" style="font-size:1.4rem;">—</div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="connectBtn">▶ Connect</button>
        <button class="btn btn-outline" id="disconnectBtn">⏹ Disconnect</button>
        <button class="btn btn-outline" id="clearLogBtn">🧹 Clear</button>
    </div>

    <div class="log-area" id="logContainer">
        <div class="log-entry"><span class="log-time">──</span><span class="log-msg">⚡ ready</span></div>
    </div>
    <div class="footer">tick stream · wss://api.derivws.com/trading/v1/options/ws/public</div>
</div>

<script>
    (function() {
        'use strict';

        // ----- DOM refs -----
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const tickCountEl = document.getElementById('tickCount');
        const lastPriceEl = document.getElementById('lastPrice');
        const epochDisplayEl = document.getElementById('epochDisplay');
        const logContainer = document.getElementById('logContainer');
        const symbolDisplay = document.getElementById('symbolDisplay');

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const clearLogBtn = document.getElementById('clearLogBtn');

        // ----- state -----
        let socket = null;
        let isConnected = false;
        let tickCounter = 0;
        const MAX_LOG = 50;

        // ----- helpers -----
        function setStatus(connected, msg) {
            isConnected = connected;
            statusDot.className = 'dot' + (connected ? ' on' : '');
            statusText.textContent = msg || (connected ? 'connected' : 'disconnected');
        }

        function updateTickCount() {
            tickCountEl.textContent = `ticks ${tickCounter}`;
        }

        function addLog(msg, isError = false) {
            const now = new Date();
            const time = now.toLocaleTimeString('en-GB', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = time;
            const msgSpan = document.createElement('span');
            msgSpan.className = 'log-msg';
            msgSpan.textContent = msg;
            if (isError) {
                msgSpan.style.color = '#b22234';
                msgSpan.style.fontWeight = '500';
            }
            entry.appendChild(timeSpan);
            entry.appendChild(msgSpan);
            logContainer.appendChild(entry);
            while (logContainer.children.length > MAX_LOG) {
                logContainer.removeChild(logContainer.firstChild);
            }
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        function clearLog() {
            while (logContainer.firstChild) {
                logContainer.removeChild(logContainer.firstChild);
            }
            const empty = document.createElement('div');
            empty.className = 'log-entry';
            empty.innerHTML = `<span class="log-time">──</span><span class="log-msg">log cleared</span>`;
            logContainer.appendChild(empty);
        }

        // ----- process tick message -----
        function handleTickMessage(data) {
            try {
                // Deriv tick format: { tick: { quote, epoch, symbol, ... } }
                if (data && data.tick) {
                    const tick = data.tick;
                    const price = tick.quote;
                    const epoch = tick.epoch;
                    const symbol = tick.symbol || 'R_100';

                    if (price !== undefined && price !== null) {
                        lastPriceEl.textContent = Number(price).toFixed(2);
                    }
                    if (epoch !== undefined && epoch !== null) {
                        epochDisplayEl.textContent = epoch;
                    }
                    if (symbol && symbolDisplay) {
                        symbolDisplay.textContent = symbol;
                    }

                    tickCounter++;
                    updateTickCount();
                    addLog(`tick ${price}  (${epoch})`);
                } else if (data && data.error) {
                    addLog(`⚠️ ${data.error.message || 'error'}`, true);
                } else {
                    // subscription ack or other
                    if (data.msg_type === 'tick') {
                        // already handled
                    } else if (data.echo_req && data.subscription) {
                        addLog(`✅ subscribed ${data.subscription?.symbol || ''}`);
                    } else if (data.msg_type !== 'pong') {
                        addLog(`📩 ${JSON.stringify(data).slice(0, 60)}`);
                    }
                }
            } catch (e) {
                addLog(`⚠️ parse error: ${e.message}`, true);
            }
        }

        // ----- connect -----
        function connectWebSocket() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                addLog('already connected');
                return;
            }
            if (socket) {
                try { socket.close(); } catch (_) {}
                socket = null;
            }

            // Use the provided public WebSocket URL
            const WS_URL = 'wss://api.derivws.com/trading/v1/options/ws/public';
            addLog('🔌 opening socket...');

            try {
                socket = new WebSocket(WS_URL);
                socket.binaryType = 'arraybuffer';

                socket.onopen = function() {
                    setStatus(true, 'connected');
                    addLog('✅ socket open, sending subscribe');
                    // subscribe to R_100 ticks
                    const sub = {
                        ticks: 'R_100',
                        subscribe: 1
                    };
                    socket.send(JSON.stringify(sub));
                    addLog('📨 subscribe R_100');
                };

                socket.onmessage = function(event) {
                    let raw;
                    if (typeof event.data === 'string') {
                        raw = event.data;
                    } else if (event.data instanceof ArrayBuffer) {
                        const dec = new TextDecoder('utf-8');
                        raw = dec.decode(event.data);
                    } else {
                        addLog('⚠️ unknown data type', true);
                        return;
                    }
                    try {
                        const parsed = JSON.parse(raw);
                        handleTickMessage(parsed);
                    } catch (e) {
                        addLog(`⚠️ invalid JSON: ${raw.slice(0, 50)}`, true);
                    }
                };

                socket.onerror = function(err) {
                    addLog(`❌ socket error: ${err.message || 'unknown'}`, true);
                    setStatus(false, 'error');
                };

                socket.onclose = function(event) {
                    const clean = event.wasClean;
                    setStatus(false, 'closed');
                    addLog(`🔒 closed (${event.code} ${clean ? 'clean' : 'unclean'})`, !clean);
                    socket = null;
                };

            } catch (err) {
                addLog(`⚠️ connection failed: ${err.message}`, true);
                setStatus(false, 'failed');
                socket = null;
            }
        }

        // ----- disconnect -----
        function disconnectWebSocket() {
            if (socket) {
                try {
                    socket.close(1000, 'user disconnect');
                } catch (_) {}
                socket = null;
                setStatus(false, 'disconnected');
                addLog('⏹ disconnected');
            } else {
                addLog('no active connection');
                setStatus(false, 'idle');
            }
        }

        // ----- init -----
        function init() {
            setStatus(false, 'idle');
            updateTickCount();
            lastPriceEl.textContent = '—';
            epochDisplayEl.textContent = '—';
            addLog('🟢 ready — press Connect');

            connectBtn.addEventListener('click', connectWebSocket);
            disconnectBtn.addEventListener('click', disconnectWebSocket);
            clearLogBtn.addEventListener('click', clearLog);

            // auto connect after small delay to show dashboard
            setTimeout(() => {
                connectWebSocket();
            }, 400);
        }

        init();
    })();
</script>
</body>
</html>
