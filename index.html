<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📈 Trading Analysis · Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f4f8fe;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.2rem;
        }
        .card {
            max-width: 780px;
            width: 100%;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 40px -10px rgba(0, 20, 30, 0.15);
            padding: 1.8rem 2rem 2rem;
        }
        h1 {
            font-weight: 600;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #0a1e2f;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.1rem;
        }
        .subhead {
            color: #3e5e72;
            font-size: 0.9rem;
            margin-bottom: 1.4rem;
            padding-left: 1rem;
            border-left: 4px solid #7bbde6;
            background: #eaf3fc;
            border-radius: 0 8px 8px 0;
            line-height: 1.5;
            padding: 0.3rem 1rem;
        }
        .price-bar {
            background: #eaf0f5;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .price-big {
            font-size: 1.8rem;
            font-weight: 600;
            color: #0a1e2f;
            letter-spacing: 0.5px;
        }
        .change-badge {
            font-weight: 500;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            background: #e3edf6;
        }
        .change-badge.up { color: #0f7b3e; background: #dcfce8; }
        .change-badge.down { color: #b22234; background: #ffe6e6; }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1.2rem 0;
        }
        .indicator-box {
            background: #f2f8ff;
            border-radius: 1.2rem;
            padding: 0.7rem 0.8rem 0.9rem;
            border: 1px solid #dde6ef;
            text-align: center;
        }
        .indicator-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #4b657a;
            font-weight: 600;
        }
        .indicator-value {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0a1e2f;
            line-height: 1.3;
        }
        .indicator-sub {
            font-size: 0.75rem;
            color: #4d738b;
        }
        .signal-box {
            background: #f2f8ff;
            border-radius: 1.2rem;
            padding: 0.7rem 1rem;
            border: 1px solid #dde6ef;
            margin: 0.8rem 0 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .signal-label {
            font-weight: 500;
            color: #1a3345;
        }
        .signal-value {
            font-weight: 600;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .signal-bull { background: #dcfce8; color: #0f7b3e; }
        .signal-bear { background: #ffe6e6; color: #b22234; }
        .signal-neutral { background: #eaf0f5; color: #3e5e72; }
        .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin: 0.8rem 0 0.6rem;
        }
        .btn {
            background: white;
            border: 1px solid #cbd7e3;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            color: #1a3345;
            transition: 0.1s;
            background: #f6faff;
            flex: 1 1 auto;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .btn-primary {
            background: #0a1e2f;
            border: 1px solid #0a1e2f;
            color: white;
        }
        .btn-primary:hover { background: #1a3348; }
        .btn-outline:hover { background: #e3edf6; }
        .btn:active { transform: scale(0.96); }
        .log-area {
            background: #f0f6fc;
            border-radius: 1.2rem;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            border: 1px solid #dfe9f0;
            max-height: 110px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #1d3a4f;
            font-family: 'SF Mono', 'Menlo', monospace;
        }
        .log-entry {
            border-bottom: 1px solid #dce6ef;
            padding: 0.2rem 0;
            display: flex;
            gap: 0.6rem;
        }
        .log-entry:last-child { border-bottom: none; }
        .log-time { color: #4d738b; min-width: 58px; }
        .footer {
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #6f8aa0;
            text-align: center;
        }
        @media (max-width: 500px) {
            .card { padding: 1.2rem; }
            .grid-2 { grid-template-columns: 1fr; }
            .price-big { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <h1>📊 Trade · Sim</h1>
    <div class="subhead">technical analysis · no broker · live simulated data</div>

    <!-- price & change -->
    <div class="price-bar">
        <span class="price-big" id="priceDisplay">—</span>
        <span class="change-badge" id="changeDisplay">—</span>
    </div>

    <!-- indicators -->
    <div class="grid-2">
        <div class="indicator-box">
            <div class="indicator-label">RSI (14)</div>
            <div class="indicator-value" id="rsiDisplay">—</div>
            <div class="indicator-sub">relative strength</div>
        </div>
        <div class="indicator-box">
            <div class="indicator-label">SMA (20)</div>
            <div class="indicator-value" id="smaDisplay">—</div>
            <div class="indicator-sub">simple moving avg</div>
        </div>
    </div>

    <!-- signal -->
    <div class="signal-box">
        <span class="signal-label">📈 signal</span>
        <span class="signal-value" id="signalDisplay">waiting</span>
    </div>

    <!-- controls -->
    <div class="actions">
        <button class="btn btn-primary" id="startBtn">▶ Start</button>
        <button class="btn btn-outline" id="stopBtn">⏹ Stop</button>
        <button class="btn btn-outline" id="resetBtn">🔄 Reset</button>
    </div>

    <!-- log -->
    <div class="log-area" id="logContainer">
        <div class="log-entry"><span class="log-time">──</span><span class="log-msg">⚡ ready</span></div>
    </div>
    <div class="footer">simulated price · RSI &amp; SMA · for educational use</div>
</div>

<script>
    (function() {
        'use strict';

        // ----- DOM refs -----
        const priceDisplay = document.getElementById('priceDisplay');
        const changeDisplay = document.getElementById('changeDisplay');
        const rsiDisplay = document.getElementById('rsiDisplay');
        const smaDisplay = document.getElementById('smaDisplay');
        const signalDisplay = document.getElementById('signalDisplay');
        const logContainer = document.getElementById('logContainer');

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ----- state -----
        let running = false;
        let timer = null;
        let priceHistory = [];
        const MAX_HISTORY = 60; // keep last 60 for SMA / RSI

        // start with a base price
        let currentPrice = 100.00;

        // ----- helpers -----
        function addLog(msg) {
            const now = new Date();
            const time = now.toLocaleTimeString('en-GB', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = time;
            const msgSpan = document.createElement('span');
            msgSpan.className = 'log-msg';
            msgSpan.textContent = msg;
            entry.appendChild(timeSpan);
            entry.appendChild(msgSpan);
            logContainer.appendChild(entry);
            while (logContainer.children.length > 30) {
                logContainer.removeChild(logContainer.firstChild);
            }
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // ----- calculate RSI (14) -----
        function calculateRSI(prices, period = 14) {
            if (prices.length < period + 1) return null;
            let gains = 0, losses = 0;
            for (let i = prices.length - period; i < prices.length - 1; i++) {
                const diff = prices[i + 1] - prices[i];
                if (diff >= 0) gains += diff;
                else losses += Math.abs(diff);
            }
            const avgGain = gains / period;
            const avgLoss = losses / period;
            if (avgLoss === 0) return 100;
            const rs = avgGain / avgLoss;
            const rsi = 100 - (100 / (1 + rs));
            return Math.round(rsi * 10) / 10;
        }

        // ----- calculate SMA (simple) -----
        function calculateSMA(prices, period = 20) {
            if (prices.length < period) return null;
            const slice = prices.slice(-period);
            const sum = slice.reduce((a, b) => a + b, 0);
            return Math.round((sum / period) * 100) / 100;
        }

        // ----- generate random walk step -----
        function randomStep(price) {
            // random walk with slight drift
            const change = (Math.random() - 0.48) * 0.6; // range ~ -0.6 .. +0.6
            let newPrice = price + change;
            // keep price positive and within reasonable range
            if (newPrice < 10) newPrice = 10 + Math.random() * 2;
            if (newPrice > 500) newPrice = 500 - Math.random() * 2;
            return Math.round(newPrice * 100) / 100;
        }

        // ----- update UI with new price -----
        function updateAnalysis(newPrice) {
            // update history
            priceHistory.push(newPrice);
            if (priceHistory.length > MAX_HISTORY) {
                priceHistory.shift();
            }

            // display price
            priceDisplay.textContent = newPrice.toFixed(2);

            // calculate change from previous price (if exists)
            if (priceHistory.length >= 2) {
                const prev = priceHistory[priceHistory.length - 2];
                const diff = newPrice - prev;
                const pct = (diff / prev) * 100;
                let changeText = `${diff >= 0 ? '+' : ''}${diff.toFixed(2)} (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%)`;
                changeDisplay.textContent = changeText;
                changeDisplay.className = 'change-badge ' + (diff >= 0 ? 'up' : 'down');
            } else {
                changeDisplay.textContent = '—';
                changeDisplay.className = 'change-badge';
            }

            // RSI
            const rsi = calculateRSI(priceHistory, 14);
            if (rsi !== null) {
                rsiDisplay.textContent = rsi.toFixed(1);
            } else {
                rsiDisplay.textContent = '—';
            }

            // SMA
            const sma = calculateSMA(priceHistory, 20);
            if (sma !== null) {
                smaDisplay.textContent = sma.toFixed(2);
            } else {
                smaDisplay.textContent = '—';
            }

            // Signal: combine RSI + price vs SMA
            let signal = 'neutral';
            let signalClass = 'signal-neutral';
            if (rsi !== null && sma !== null) {
                if (rsi < 30 && newPrice < sma) {
                    signal = '📈 oversold · buy';
                    signalClass = 'signal-bull';
                } else if (rsi > 70 && newPrice > sma) {
                    signal = '📉 overbought · sell';
                    signalClass = 'signal-bear';
                } else if (rsi < 40 && newPrice < sma * 0.98) {
                    signal = '↗️ weak bullish';
                    signalClass = 'signal-bull';
                } else if (rsi > 60 && newPrice > sma * 1.02) {
                    signal = '↘️ weak bearish';
                    signalClass = 'signal-bear';
                } else {
                    signal = '⚖️ neutral';
                    signalClass = 'signal-neutral';
                }
            } else {
                signal = '⏳ accumulating...';
                signalClass = 'signal-neutral';
            }
            signalDisplay.textContent = signal;
            signalDisplay.className = 'signal-value ' + signalClass;
        }

        // ----- tick generator -----
        function tick() {
            if (!running) return;
            const newPrice = randomStep(currentPrice);
            currentPrice = newPrice;
            updateAnalysis(newPrice);
            // log every 5 ticks (approx)
            if (priceHistory.length % 5 === 0) {
                addLog(`price ${newPrice.toFixed(2)}  |  RSI ${rsiDisplay.textContent}  |  SMA ${smaDisplay.textContent}`);
            }
        }

        // ----- start / stop / reset -----
        function startSimulation() {
            if (running) return;
            if (priceHistory.length === 0) {
                // seed with some history
                let seed = 100;
                for (let i = 0; i < 25; i++) {
                    seed = randomStep(seed);
                    priceHistory.push(seed);
                }
                currentPrice = seed;
                updateAnalysis(currentPrice);
                addLog('🔄 seeded history (25 bars)');
            }
            running = true;
            timer = setInterval(tick, 400); // 400ms ~ 2.5 ticks/sec
            addLog('▶️ simulation started');
            startBtn.textContent = '⏳ Running';
            startBtn.disabled = true;
        }

        function stopSimulation() {
            if (timer) {
                clearInterval(timer);
                timer = null;
            }
            running = false;
            startBtn.textContent = '▶ Start';
            startBtn.disabled = false;
            addLog('⏹ simulation stopped');
        }

        function resetSimulation() {
            stopSimulation();
            priceHistory = [];
            currentPrice = 100;
            priceDisplay.textContent = '—';
            changeDisplay.textContent = '—';
            changeDisplay.className = 'change-badge';
            rsiDisplay.textContent = '—';
            smaDisplay.textContent = '—';
            signalDisplay.textContent = 'waiting';
            signalDisplay.className = 'signal-value signal-neutral';
            // clear log but keep one line
            while (logContainer.firstChild) {
                logContainer.removeChild(logContainer.firstChild);
            }
            const empty = document.createElement('div');
            empty.className = 'log-entry';
            empty.innerHTML = `<span class="log-time">──</span><span class="log-msg">🔄 reset</span>`;
            logContainer.appendChild(empty);
            addLog('🔄 reset complete');
            startBtn.textContent = '▶ Start';
            startBtn.disabled = false;
        }

        // ----- init -----
        function init() {
            // seed initial price for display
            currentPrice = 100;
            priceHistory = [];
            // pre-seed some history so indicators have data on start
            let seed = 100;
            for (let i = 0; i < 30; i++) {
                seed = randomStep(seed);
                priceHistory.push(seed);
            }
            currentPrice = seed;
            updateAnalysis(currentPrice);
            addLog('🟢 ready · press Start to simulate');

            startBtn.addEventListener('click', startSimulation);
            stopBtn.addEventListener('click', stopSimulation);
            resetBtn.addEventListener('click', resetSimulation);
        }

        init();
    })();
</script>
</body>
</html>
