<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmeli_FX · Deriv Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bot-card">
        <div class="header">
            <div class="brand">
                <h1>Mmeli_FX</h1>
                <small>Deriv Bot</small>
            </div>
            <div class="status-pill">
                <span class="status-dot" id="statusDot"></span>
                <span id="connectionLabel">disconnected</span>
            </div>
        </div>

        <div class="token-row">
            <input type="text" id="tokenInput" placeholder="Paste your Deriv token..." value="">
            <button class="connect-btn" id="connectBtn">🔗 Connect</button>
        </div>

        <div class="info-grid">
            <div class="balance-box">
                💰 Balance <span id="balanceDisplay">—</span>
            </div>
            <div class="ticker-badge">
                📈 Tick <strong id="tickValue">—</strong>
            </div>
        </div>

        <div class="strategy-panel">
            <button class="strategy-btn active" data-strategy="evenodd">🎯 Even / Odd</button>
            <button class="strategy-btn" data-strategy="overunder">📊 Over / Under</button>
        </div>

        <div class="trade-status-bar">
            <span class="label">⚡ Last Trade</span>
            <span class="value" id="tradeStatus">Waiting for ticks...</span>
        </div>

        <div class="history-header">
            <h3>📋 Win / Loss History</h3>
            <button class="clear-btn" id="clearHistoryBtn">Clear</button>
        </div>
        <div class="history-box" id="historyContainer">
            <div class="empty-history">No trades yet</div>
        </div>

        <div class="footer-meta">
            <span>🔌 WebSocket Port 1995</span>
            <span id="tradeCount">Trades: 0</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
